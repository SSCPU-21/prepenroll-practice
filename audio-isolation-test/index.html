<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prepenroll · Audio Isolation Test</title><style>body{font:16px system-ui;background:#f6f9fc;color:#183149;max-width:680px;margin:60px auto;padding:18px}section{background:white;border-radius:18px;padding:26px;box-shadow:0 8px 30px #15324b11}button{background:#dcedff;border:1px solid #a9cbec;padding:16px;border-radius:12px;cursor:pointer;font-size:16px;margin:8px}pre{white-space:pre-wrap;background:#f0f4f8;border-radius:12px;padding:14px}</style><section><h2>Prepenroll · Chrome Audio Test</h2><p>This test is completely separate from the IB questions. It runs the exact command that worked in your Chrome Console.</p><button id="simple">🔊 Test direct speech</button><button id="long">📖 Test Physics sentence</button><button id="stop">⏹️ Stop</button><pre id="log">Ready.</pre></section><script>const log=document.getElementById('log');function say(text){log.textContent='Starting...';const u=new SpeechSynthesisUtterance(text);u.onstart=()=>log.textContent='Started speaking';u.onend=()=>log.textContent='Finished';u.onerror=e=>log.textContent='Error: '+e.error;speechSynthesis.speak(u)}document.getElementById('simple').onclick=()=>say('Hello, welcome to Prepenroll Physics.');document.getElementById('long').onclick=()=>say('A ball moves with a constant acceleration. Calculate the final velocity after five seconds.');document.getElementById('stop').onclick=()=>{speechSynthesis.cancel();log.textContent='Stopped'}</script></html>
